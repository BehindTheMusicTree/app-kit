name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: validate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-vitest
          path: packages/*/coverage/cobertura-coverage.xml
          if-no-files-found: error
      - name: Install Chromium
        run: pnpm --filter app-kit-playground exec playwright install --with-deps chromium
      - name: Browser integration tests
        run: pnpm --filter app-kit-playground test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playground-browser-results
          path: apps/playground/test-results/
          retention-days: 7

  coverage:
    needs: build
    permissions:
      contents: read
    uses: BehindTheMusicTree/github-workflows/.github/workflows/coverage.yml@18b90bc9c64b9abab0a86e7ea74f65acac93aec1 # v6.6.0
    with:
      # Floor shared by both packages; their vitest configs keep stricter per-package thresholds.
      line: 85
      branch: 85

  tests-success:
    name: Tests success
    needs: [build, coverage]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require build, tests and coverage to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$NEEDS"
