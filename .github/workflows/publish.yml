name: Publish to npm

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout release foundation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: BehindTheMusicTree/github-workflows
          ref: 84a73457403e20021217fe52ee650bd8de3cdca5
          path: .release-foundation
          persist-credentials: false

      - name: Validate tag and release notes
        run: python3 .release-foundation/release/github-release.py notes "$RUNNER_TEMP/release-notes.md"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @behindthemusictree/app-kit run build

      - run: pnpm --filter @behindthemusictree/app-kit-ui run build

      # pnpm pack rewrites workspace:/catalog: specifiers. The trusted publishers only allow staging:
      # the trusted publishers must allow direct `npm publish` (Allow npm publish), otherwise these
      # steps fail with ENEEDAUTH. app-kit goes first: app-kit-ui's peer dependency targets it.
      - run: npm install -g npm@11.21.1
      - run: pnpm --filter @behindthemusictree/app-kit pack --pack-destination "$RUNNER_TEMP"
      - run: pnpm --filter @behindthemusictree/app-kit-ui pack --pack-destination "$RUNNER_TEMP"
      - name: Check existing app-kit artifact
        id: registry-core
        run: node .release-foundation/release/npm-artifact.cjs @behindthemusictree/app-kit "$(node -p "require('./packages/app-kit/package.json').version")" "$RUNNER_TEMP"/behindthemusictree-app-kit-[0-9]*.tgz
      - if: steps.registry-core.outputs.exists != 'true'
        run: npm publish "$RUNNER_TEMP"/behindthemusictree-app-kit-[0-9]*.tgz --provenance --access public
      - name: Check existing app-kit-ui artifact
        id: registry-ui
        run: node .release-foundation/release/npm-artifact.cjs @behindthemusictree/app-kit-ui "$(node -p "require('./packages/app-kit-ui/package.json').version")" "$RUNNER_TEMP"/behindthemusictree-app-kit-ui-*.tgz
      - if: steps.registry-ui.outputs.exists != 'true'
        run: npm publish "$RUNNER_TEMP"/behindthemusictree-app-kit-ui-*.tgz --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
