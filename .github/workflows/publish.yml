name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: read

# Preserve every main push carrying a release.
concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tag:
    permissions:
      contents: write
    uses: BehindTheMusicTree/github-workflows/.github/workflows/release-tag.yml@18b90bc9c64b9abab0a86e7ea74f65acac93aec1 # v6.6.0
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      release-app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  publish:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout release foundation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: BehindTheMusicTree/github-workflows
          ref: 18b90bc9c64b9abab0a86e7ea74f65acac93aec1 # v6.6.0
          path: .release-foundation
          persist-credentials: false

      - name: Validate tag and release notes
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: python3 .release-foundation/release/github-release.py notes "$RUNNER_TEMP/release-notes.md"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @behindthemusictree/app-kit run build

      - run: pnpm --filter @behindthemusictree/app-kit-ui run build

      # pnpm pack resolves the lockstep app-kit peer range from workspace:^.
      # Publish app-kit first so that range is satisfiable when app-kit-ui becomes available.
      - run: npm install -g npm@11.21.1
      - run: pnpm --filter @behindthemusictree/app-kit pack --pack-destination "$RUNNER_TEMP"
      - run: pnpm --filter @behindthemusictree/app-kit-ui pack --pack-destination "$RUNNER_TEMP"
      - name: Check existing app-kit artifact
        id: registry-core
        run: node .release-foundation/release/npm-artifact.cjs @behindthemusictree/app-kit "$(node -p "require('./packages/app-kit/package.json').version")" "$RUNNER_TEMP"/behindthemusictree-app-kit-[0-9]*.tgz
      - if: steps.registry-core.outputs.exists != 'true'
        run: npm publish "$RUNNER_TEMP"/behindthemusictree-app-kit-[0-9]*.tgz --provenance --access public
      - name: Check existing app-kit-ui artifact
        id: registry-ui
        run: node .release-foundation/release/npm-artifact.cjs @behindthemusictree/app-kit-ui "$(node -p "require('./packages/app-kit-ui/package.json').version")" "$RUNNER_TEMP"/behindthemusictree-app-kit-ui-*.tgz
      - if: steps.registry-ui.outputs.exists != 'true'
        run: npm publish "$RUNNER_TEMP"/behindthemusictree-app-kit-ui-*.tgz --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-please:
    needs: [tag, publish]
    # Ordinary pushes skip publishing and still reconcile the release PR.
    if: ${{ !cancelled() && needs.tag.result == 'success' && (needs.tag.outputs.tag == '' || needs.publish.result == 'success') }}
    uses: BehindTheMusicTree/github-workflows/.github/workflows/release-please.yml@18b90bc9c64b9abab0a86e7ea74f65acac93aec1 # v6.6.0
    with:
      app-id: ${{ vars.RELEASE_PR_APP_ID }}
      auto-merge: true
      release-policies: .github/release-policy.json
    secrets:
      release-pr-app-private-key: ${{ secrets.RELEASE_PR_APP_PRIVATE_KEY }}
